[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inflammappbpk"
version = "0.1.0"
description = "Mechanistic anti-TNF PBPK research scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3", "scipy>=1.14,<2", "pandas>=2.2,<3",
  "matplotlib>=3.9,<4", "pint>=0.24,<1", "pydantic>=2.9,<3", "sympy>=1.13,<2",
  "lmfit>=1.3,<2", "SALib>=1.5,<2",
  "pyarrow>=18,<30", "duckdb>=1.1,<2", "openpyxl>=3.1,<4",
  "requests>=2.32,<3", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "lxml>=5,<7",
  "pymupdf>=1.24,<2", "pypdf>=5,<7",
]

[project.optional-dependencies]
inference = ["arviz>=0.20,<1", "numpyro>=0.19,<0.20", "jax>=0.6.2,<0.7", "diffrax>=0.7,<0.8"]
bioinformatics = ["scanpy>=1.11,<2", "anndata>=0.11,<1", "mygene>=3.2,<4", "biopython>=1.84,<2"]
visualisation = ["plotly>=6,<7", "streamlit>=1.40,<2", "kaleido>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.14,<2",
       "pre-commit>=4,<5", "jupyterlab>=4.3,<5", "ipykernel>=6.29,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
